# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "auto-approve"
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    labels:
      - "auto-approve"
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: "weekly"
    labels:
      - "auto-approve"
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      javascript:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "auto-approve"
      - "dependencies"
    open-pull-requests-limit: 5
